  <meta charset="UTF-8">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--tp-app-height, 100lvh);
      min-height: var(--tp-app-height, 100lvh);
      overflow: hidden;
      background-color: #0B1730;
    }
    flutter-view, flt-glass-pane {
      width: 100% !important;
      height: 100% !important;
      min-height: 100% !important;
      max-height: none !important;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var baseline = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
      var landscape = window.innerWidth > window.innerHeight;
      var timer = null;
      function visualHeight() {
        var viewport = window.visualViewport;
        if (!viewport) return window.innerHeight || 0;
        return viewport.height + viewport.offsetTop;
      }
      function overlap() {
        return Math.max(0, baseline - visualHeight());
      }
      function keyboardOpen() {
        return overlap() > 80;
      }
      function apply() {
        document.documentElement.style.setProperty(
          '--tp-app-height',
          Math.round(baseline) + 'px'
        );
      }
      function refreshBaseline() {
        var nowLandscape = window.innerWidth > window.innerHeight;
        if (nowLandscape !== landscape) {
          landscape = nowLandscape;
          baseline = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
        }
        if (!keyboardOpen()) {
          var measured = Math.max(
            window.innerHeight || 0,
            document.documentElement.clientHeight || 0,
            visualHeight()
          );
          if (measured > baseline) baseline = measured;
        }
        apply();
        return baseline;
      }
      window.__tpLayoutHeight = function () { return baseline; };
      window.__tpKeyboardOverlap = function () { return overlap(); };
      window.__tpSyncViewport = function () { return refreshBaseline(); };
      window.__tpReleaseKeyboard = function () {
        if (keyboardOpen()) return;
        if (window.scrollX || window.scrollY) {
          window.scrollTo(0, 0);
        }
        refreshBaseline();
      };
      apply();
      function onViewportChange() {
        if (timer) window.clearTimeout(timer);
        timer = window.setTimeout(function () {
          timer = null;
          refreshBaseline();
          if (!keyboardOpen() && (window.scrollX || window.scrollY)) {
            window.scrollTo(0, 0);
          }
        }, 80);
      }
      window.addEventListener('resize', onViewportChange);
      window.addEventListener('orientationchange', function () {
        landscape = window.innerWidth > window.innerHeight;
        baseline = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
        apply();
      });
      window.addEventListener('pageshow', refreshBaseline);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', onViewportChange);
        window.visualViewport.addEventListener('scroll', onViewportChange);
      }
    })();
    window.__tpInstallPrompt = null;
    window.__tpTakeInstallPrompt = function () {
      var prompt = window.__tpInstallPrompt;
      window.__tpInstallPrompt = null;
      return prompt || null;
    };
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__tpInstallPrompt = event;
      window.dispatchEvent(new Event('tp-install-ready'));
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

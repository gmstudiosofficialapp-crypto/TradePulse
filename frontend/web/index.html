<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TradePulse OTC demo trading.">
  <meta name="theme-color" content="#0B1730">
  <meta name="google-site-verification" content="540SSMWwRr2uzkMH898NimmNG0I3qo3dvSdNNAOTHeA" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TradePulse">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

  <title>TradePulse</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--tp-visible-height, 100dvh);
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #0B1730;
    }
    flutter-view, flt-glass-pane {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var last = 0;
      function visibleHeight() {
        var viewport = window.visualViewport;
        if (viewport && viewport.height) return Math.round(viewport.height);
        return Math.round(window.innerHeight || document.documentElement.clientHeight || 0);
      }
      function apply() {
        var height = visibleHeight();
        if (height < 80) return;
        if (height !== last) {
          last = height;
          document.documentElement.style.setProperty('--tp-visible-height', height + 'px');
          ['flutter-view', 'flt-glass-pane'].forEach(function (selector) {
            var el = document.querySelector(selector);
            if (!el || !el.style) return;
            el.style.height = height + 'px';
            el.style.maxHeight = height + 'px';
          });
        }
        if (window.scrollX || window.scrollY) {
          window.scrollTo(0, 0);
        }
      }
      apply();
      window.addEventListener('resize', apply);
      window.addEventListener('orientationchange', function () {
        last = 0;
        window.setTimeout(apply, 60);
      });
      window.addEventListener('scroll', apply, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', apply);
        window.visualViewport.addEventListener('scroll', apply);
      }
    })();
    window.__tpInstallPrompt = null;
    window.__tpTakeInstallPrompt = function () {
      var prompt = window.__tpInstallPrompt;
      window.__tpInstallPrompt = null;
      return prompt || null;
    };
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__tpInstallPrompt = event;
      window.dispatchEvent(new Event('tp-install-ready'));
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
